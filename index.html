<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="title"></div>
  <div id="main">
    <div id="board">
      <div id="options">
        <div id="to_draw">
          <p>Draw:</p>
        </div>
        <div id="rubber">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="rgb(140,140,140)"><path d="M690-240h190v80H610l80-80Zm-500 80-85-85q-23-23-23.5-57t22.5-58l440-456q23-24 56.5-24t56.5 23l199 199q23 23 23 57t-23 57L520-160H190Zm296-80 314-322-198-198-442 456 64 64h262Zm-6-240Z"/></svg>
        </div>
        <div id="reload">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="rgb(140,140,140)"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></svg>
        </div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <div id="result_box">
      <div id="prediction">
        <p>Is a:</p>
      </div>
      <button id="send">
        <p>Send!</p>
      </button>
    </div>
    <div id="zoom">
      <button onclick="setZoom(0.5)" id="zin">+</button>
      <button onclick="setZoom(-0.5)" id ="zout">−</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
